name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -1 "${ANDROID_HOME}/platforms" 2>/dev/null || true
          ls -1 "${ANDROID_HOME}/build-tools" 2>/dev/null || true

      - name: Ensure Android 34 SDK
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
            "$MANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk \
            --title "APK build #${GITHUB_RUN_NUMBER}" \
            --notes "自动编译的安装包，下载后可直接安装。"

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -s build.log ]; then
            BODY=build.log
          else
            {
              echo "构建在编译开始前就失败了，运行日志见："
              echo ""
              echo "$RUN_URL"
            } > fallback.log
            BODY=fallback.log
          fi
          gh issue create --title "构建失败 #${GITHUB_RUN_NUMBER}" --body-file "$BODY" || true
